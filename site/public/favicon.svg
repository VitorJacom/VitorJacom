<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="j-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background Squircle com borda técnica sutil -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Monograma V: Estilo tech com linhas fluidas precisas -->
  <path d="M15 22 L26 44 L37 22" fill="none" stroke="url(#v-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monograma J: Alinhado e com terminação curvilínea moderna -->
  <path d="M47 22 V38 C47 42.5 43.5 45 39 45 C36 45 34 43.8 33 42" fill="none" stroke="url(#j-grad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Nó de rede / Microchip point -->
  <circle cx="47" cy="15" r="3" fill="#38bdf8" />
</svg>
